# A release, on a `v*` tag: the gate on both systems, then the tool package and the extension
# built with the tag's version, kept as artifacts of the run and attached to a release named
# after the tag. Nothing is published to nuget.org or to the marketplace: this repository holds
# no secrets for them, and where a release is published is the owner's decision.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/gate.yml

  package:
    needs: gate
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The extension is packaged with vsce, which npm brings.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The tag is the version, without the `v` a tag is written with.
      - name: Package as ${{ github.ref_name }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          pwsh -NoProfile scripts/package.ps1 -Version $version

      - uses: actions/upload-artifact@v7
        with:
          name: nt65-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            artifacts/*.nupkg
            artifacts/*.vsix

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem artifacts/*.nupkg, artifacts/*.vsix).FullName
          gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --generate-notes @files
