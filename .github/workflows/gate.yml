# The gate, on every push to main and every pull request: scripts/gate.ps1 on Windows and on
# Linux, which is where the scripts are written to run. The release workflow calls it too.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Cancel a run when a newer commit to the same ref supersedes it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MSYS2_BIN: C:\msys64\mingw64\bin;C:\msys64\usr\bin

jobs:
  gate:
    # Let each system finish even when the other fails, so a failure on either is seen on its own.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The extension's client is checked with `node --check`.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The example converts its pictures and sounds with Python tools before nt65 sees them.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python -m pip install --quiet Pillow

      # The pinned cc65: the tools, headers and asminc under .cache/cc65, and the source
      # checkout under .cache/cc65-src, which the tests read. Both are determined entirely by
      # the pinned commit, so the commit and the OS are the whole cache key. On a cache hit,
      # build-cc65.ps1 sees the tools reporting the pinned commit and does nothing.
      - uses: actions/cache@v6
        with:
          path: |
            .cache/cc65
            .cache/cc65-src
          key: cc65-${{ runner.os }}-${{ hashFiles('scripts/cc65.commit') }}

      # Ubuntu carries make and gcc already. The Windows image carries MSYS2 but keeps it off
      # PATH; mingw64 goes first so gcc is the native toolchain, not the msys one. It goes on
      # PATH for the steps that build and no others, so that MSYS2's tar does not shadow the
      # one the cache action saves with.
      - name: Install make and a MinGW gcc
        if: runner.os == 'Windows'
        run: |
          $env:PATH = "$env:MSYS2_BIN;$env:PATH"
          if (-not ((Get-Command make -ErrorAction SilentlyContinue) -and
                    (Get-Command gcc -ErrorAction SilentlyContinue))) {
            C:\msys64\usr\bin\pacman.exe -Sy --needed --noconfirm make mingw-w64-x86_64-gcc
          }

      - name: Run the gate
        run: |
          if ($IsWindows) { $env:PATH = "$env:MSYS2_BIN;$env:PATH" }
          pwsh -NoProfile scripts/gate.ps1

      # Coverage of the fast suite, printed but never failing the run. One system is enough,
      # and Windows is the one the suite is developed on.
      - name: Coverage
        if: runner.os == 'Windows'
        run: pwsh -NoProfile scripts/coverage.ps1
