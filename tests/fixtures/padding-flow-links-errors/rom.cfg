# Each segment's padding is filled with a byte that does not run on, or with one nt65 cannot work
# out. FILL comes from ld65's command line, as `-D FILL=$EA` would give it.
MEMORY {
    ROM:   start = $8000, size = $2000, file = %O, fillval = $FF;
    NOPS:  start = $A000, size = $2000, file = %O, fillval = $EA;
    PLAIN: start = $C000, size = $1000, file = %O;
    ASKED: start = $D000, size = $1000, file = %O, fillval = FILL;
}
SEGMENTS {
    CODE:   load = ROM, type = ro;
    ZEROED: load = NOPS, type = ro, fillval = $00;
    PLAIN:  load = PLAIN, type = ro;
    ASKED:  load = ASKED, type = ro;
}
