# A program that loads at $0801, with a routine copied to the zero page to run there and a
# block of tables in a 4K area of its own at $C000.
MEMORY {
    ZP:     file = "", start = $0002, size = $0010;
    ZPCODE: file = "", start = $0012, size = $007E;
    MAIN:   file = %O, start = $0801, size = $97FF;
    HIGH:   file = %O, start = $C000, size = $1000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    CODE:     load = MAIN, type = ro, define = yes;
    FAST:     load = MAIN, run = ZPCODE, type = rw, define = yes;
    TABLES:   load = HIGH, type = ro, define = yes;
}
