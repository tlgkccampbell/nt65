# A cartridge whose code runs in banks $80 and $81, with two overlays that the program copies
# into the same addresses of work RAM in bank $7F.
MEMORY {
    ZP:    start = $0000, size = $0100;
    ROM0:  start = $808000, size = $8000, file = %O, fill = yes;
    ROM1:  start = $818000, size = $8000, file = %O, fill = yes;
    OVLA:  start = $7F0000, size = $8000, file = %O;
    OVLB:  start = $7F0000, size = $8000, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    CODE:     load = ROM0, type = ro;
    BANK1:    load = ROM1, type = ro;
    OVERLAYA: load = OVLA, type = ro;
    OVERLAYB: load = OVLB, type = ro;
}
