# A cartridge with two switchable banks at $8000 and a fixed bank at $C000, and two disk
# overlays that load at the same address in RAM. The command line gives the loader's address.
# The program area is given more room than it fills, and runs on into its variables.
MEMORY {
    ZP:     start = $0000, size = $0100;
    RAM:    start = $0300, size = $0500;
    OVL1:   start = $6000, size = $1000, file = "ovl1.bin";
    OVL2:   start = $6000, size = $1000, file = "ovl2.bin";
    LOADER: start = %S, size = $1000, file = "loader.bin";
    PROG:   start = $1000, size = $3000, file = "prog.bin";
    VARS:   start = $3000, size = $0800, file = "";
    ROM00:  start = $8000, size = $4000, file = %O, fill = yes;
    ROM01:  start = $8000, size = $4000, file = %O, fill = yes;
    ROM15:  start = $C000, size = $4000, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    BSS:      load = RAM, type = bss;
    OVERLAY1: load = OVL1, type = ro;
    OVERLAY2: load = OVL2, type = ro;
    LOADER:   load = LOADER, type = ro;
    PROGRAM:  load = PROG, type = ro;
    VARIABLES: load = VARS, type = bss;
    BANK00:   load = ROM00, type = ro;
    BANK01:   load = ROM01, type = ro;
    CODE:     load = ROM15, type = ro;
    RODATA:   load = ROM15, type = ro;
}
