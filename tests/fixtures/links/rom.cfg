# A cartridge whose code runs in bank $80, with low RAM in bank $00, work RAM in bank $7E, a
# far bank of tables, and a sound driver that the host copies to the sound CPU's memory.
MEMORY {
    ZP:     start = $0000, size = $0100;
    RAM:    start = $0200, size = $1E00;
    WRAM:   start = $7E2000, size = $E000;
    ROM:    start = $808000, size = $8000, file = %O, fill = yes;
    FAR:    start = $C00000, size = $10000, file = %O;
    SPCRAM: start = $0200, size = $FDC0;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    BSS:      load = RAM, type = bss;
    WRAM:     load = WRAM, type = bss;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro;
    SPCIMAGE: load = ROM, run = SPCRAM, define = yes;
    FARDATA:  load = FAR, type = ro;
}
