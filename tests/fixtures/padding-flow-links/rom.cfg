# ROM fills its segments' padding with $EA, which is `nop`. BANKS fills with $FF, except where a
# segment gives its own fill.
MEMORY {
    ROM:   start = $8000, size = $4000, file = %O, fillval = $EA;
    BANKS: start = $C000, size = $4000, file = %O, fillval = $FF;
}
SEGMENTS {
    CODE:   load = ROM, type = ro;
    BANKED: load = BANKS, type = ro, fillval = $EA;
    TABLES: load = BANKS, type = ro;
}
