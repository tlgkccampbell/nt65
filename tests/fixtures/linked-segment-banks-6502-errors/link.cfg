# A 6502 cartridge whose switchable banks the linker places at $18000 and $28000, past what the
# CPU sees, so that labels in them are bank $01 and bank $02 addresses.
MEMORY {
    ROM0: start = $8000,  size = $8000, type = ro, file = %O, fill = yes;
    ROM1: start = $18000, size = $8000, type = ro, file = %O, fill = yes;
    ROM2: start = $28000, size = $8000, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    CODE:  load = ROM0, type = ro;
    BANK1: load = ROM1, type = ro;
    BANK2: load = ROM2, type = ro;
}
