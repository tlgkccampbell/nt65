# The disk build, which loads the whole program into RAM, so WORK's values are in the file.
MEMORY {
    ZP:  start = $0000, size = $0100, file = "";
    RAM: start = $0200, size = $0600, file = %O;
    PRG: start = $0800, size = $7800, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    BSS:      load = RAM, type = bss;
    WORK:     load = RAM, type = rw;
    CODE:     load = PRG, type = ro;
}
