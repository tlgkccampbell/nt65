# A 6502 cartridge whose second 32K bank the linker places at $18000, past what the CPU sees,
# so that labels in it are bank $01 addresses.
MEMORY {
    ROM0: start = $8000,  size = $8000, type = ro, file = %O, fill = yes;
    ROM1: start = $18000, size = $8000, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    CODE:   load = ROM0, type = ro;
    RODATA: load = ROM0, type = ro;
    BANK1:  load = ROM1, type = ro;
}
