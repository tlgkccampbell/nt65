# A 65816 program in two ROM banks at $80 and $81, with work RAM in banks $00 and $7e.
MEMORY {
    ZP:    start = $0000,   size = $0100, type = rw, file = "";
    LORAM: start = $0200,   size = $1E00, type = rw, file = "";
    ROM0:  start = $808000, size = $8000, type = ro, file = %O, fill = yes;
    ROM1:  start = $818000, size = $8000, type = ro, file = %O, fill = yes;
    WRAM:  start = $7E2000, size = $E000, type = rw, file = "";
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    LOWRAM:   load = LORAM, type = bss;
    CODE:     load = ROM0, type = ro;
    RODATA:   load = ROM0, type = ro;
    FARDATA:  load = ROM1, type = ro, define = yes;
    DATA7E:   load = WRAM, type = bss, define = yes;
}
