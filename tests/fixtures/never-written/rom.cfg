# A ROM whose variables live in RAM. ld65 writes only the ROM area to the output, so the
# zero page, BSS and WORK hold no values when the program starts. DATA loads with the ROM and
# is copied to RAM.
MEMORY {
    ZP:  start = $0000, size = $0100, file = "";
    RAM: start = $0200, size = $0600, file = "";
    ROM: start = $8000, size = $8000, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    BSS:      load = RAM, type = bss;
    WORK:     load = RAM, type = rw;
    DATA:     load = ROM, run = RAM, type = rw, define = yes;
    CODE:     load = ROM, type = ro;
}
