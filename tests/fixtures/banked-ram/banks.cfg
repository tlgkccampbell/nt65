MEMORY {
    ZP:    start = $0022, size = $005E;
    MAIN:  start = $0801, size = $96FF, file = %O;
    BANK1: start = $A000, size = $2000, file = "%O.01", bank = 1;
    BANK2: start = $A000, size = $2000, file = "%O.02", bank = 2;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    CODE:     load = MAIN,  type = ro;
    RODATA:   load = MAIN,  type = ro;
    TOOLS:    load = BANK1, type = ro;
    TABLES:   load = BANK2, type = ro;
}
