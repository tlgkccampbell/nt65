# A program for sim65, cc65's simulator. The file starts with the header sim65 reads, and the
# rest loads at $0200.
MEMORY {
    ZP:     file = "", start = $0000, size = $0100;
    HEADER: file = %O, start = $0000, size = $000C;
    MAIN:   file = %O, start = $0200, size = $EC00;
}

SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    EXEHDR:   load = HEADER, type = ro;
    CODE:     load = MAIN,   type = ro;
    BSS:      load = MAIN,   type = bss;
}
