MEMORY {
    ZP:      start = $000000, size = $0100, type = rw;
    LORAM:   start = $000200, size = $1E00, type = rw;
    WRAM:    start = $7E2000, size = $E000, type = rw;
    STUBS:   start = $008000, size = $0080, fill = yes, file = %O;
    ROM0:    start = $808080, size = $7F40, fill = yes, file = %O;
    HDR:     start = $00FFC0, size = $0020, fill = yes, file = %O;
    VEC:     start = $00FFE0, size = $0020, fill = yes, file = %O;
    ROM1:    start = $818000, size = $8000, fill = yes, file = %O;
    ROM2:    start = $828000, size = $8000, fill = yes, file = %O;
    ROM3:    start = $838000, size = $8000, fill = yes, file = %O;
}
SEGMENTS {
    DIRECT:  load = ZP,    type = zp;
    LORAM:   load = LORAM, type = bss;
    WRAM:    load = WRAM,  type = bss;
    STUBS:   load = STUBS, type = ro;
    CODE0:   load = ROM0,  type = ro;
    RODATA0: load = ROM0,  type = ro;
    HEADER:  load = HDR,   type = ro;
    VECTORS: load = VEC,   type = ro;
    BANK1:   load = ROM1,  type = ro;
    GFXDATA: load = ROM2,  type = ro;
}
