MEMORY {
    ZP:    start = $0080, size = $0040, type = rw, define = yes;
    RAM:   start = $0800, size = $7000, type = rw, file = %O, fill = yes;
    STK:   start = $7800, size = $0400, type = rw, define = yes;
    ROM:   start = $F000, size = $0FFA, type = ro, file = %O, fill = yes;
    VEC:   start = $FFFA, size = $0006, type = ro, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    STARTUP:  load = ROM, type = ro;
    ONCE:     load = ROM, type = ro, optional = yes;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro;
    DATA:     load = ROM, run = RAM, type = rw, define = yes, optional = yes;
    BSS:      load = RAM, type = bss, define = yes;
    VECTORS:  load = VEC, type = ro;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
}
SYMBOLS {
    __STACK_SIZE__: type = weak, value = $0400;
    __STACK_START__: type = weak, value = $7800;
}
