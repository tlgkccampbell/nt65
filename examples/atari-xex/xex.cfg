# An Atari executable, a XEX, which DOS or a loader reads one load segment at a time. ld65 writes
# each memory area below as a segment of its own, in the order they are listed, with an INITAD
# after an area that names one, so that the loader calls that routine as soon as the area is in.
#
#   SYSCHK   page 6         checks that the program fits, before anything else loads
#   LOADER   $A000-$A3FF    shows the loading screen while MAIN loads
#   MAIN     $2000-$9FFF    the program; once it is in, the loader blanks its screen
#   SCREEN   $A000-$A3FF    the program's own screen, loaded over the loader
#
# LOADER and SCREEN are the same addresses, so nothing in one can reach the other. Then RUNAD
# starts the program.
MEMORY {
    ZP:     file = "", start = $0080, size = $0080;
    SYSCHK: file = %O, start = $0600, size = $0100;
    LOADER: file = %O, start = $A000, size = $0400;
    MAIN:   file = %O, start = $2000, size = $8000;
    SCREEN: file = %O, start = $A000, size = $0400;
}
FILES {
    %O: format = atari;
}
FORMATS {
    atari: initad = SYSCHK: syscheck__run,
           initad = LOADER: loader__show,
           initad = MAIN:   loader__hide,
           runad  = main__start;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    SYSCHK:   load = SYSCHK, type = ro;
    LOADER:   load = LOADER, type = ro;
    CODE:     load = MAIN,   type = ro;
    RODATA:   load = MAIN,   type = ro;
    BSS:      load = MAIN,   type = bss;
    SCREEN:   load = SCREEN, type = rw;
}
