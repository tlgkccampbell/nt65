# A 32 KiB LoROM: bank $00 from $8000, with the header and vectors at the top of it.
MEMORY {
    ZP:  start = $0000, size = $0100, type = rw;
    PRG: start = $8000, size = $7FC0, fill = yes, file = %O;
    HDR: start = $FFC0, size = $0020, fill = yes, file = %O;
    VEC: start = $FFE0, size = $0020, fill = yes, file = %O;
}
SEGMENTS {
    DIRECT:  load = ZP,  type = zp;
    ROM:     load = PRG, type = ro;
    HEADER:  load = HDR, type = ro;
    VECTORS: load = VEC, type = ro;
}
