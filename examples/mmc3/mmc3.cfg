# A TxROM cartridge for the MMC3, as an iNES file: a 16-byte header, 64K of program ROM in eight
# 8K banks, and 16K of character ROM in sixteen 1K banks.
#
# The MMC3 maps two of the program banks, chosen by its registers R6 and R7, at $8000 and $A000,
# and always maps the last two at $C000 and $E000. Banks 0 to 2 are linked to run at $8000 and
# banks 3 to 5 at $A000, so the areas at one address are alternatives that nt65 knows can
# never be mapped together. Every bank starts with its own number.
#
# Banks 6 and 7 are fixed. After a reset only bank 7 is sure to be at $E000, since the MMC3 may
# start in the mode that swaps $8000 and $C000, so the reset code, the interrupt handlers and
# the vectors are there. The sample the DMC plays is at the start of bank 6, where the DMC can
# reach it: a sample must start at a multiple of 64 bytes from $C000.
#
# The character ROM is split where the program switches it: a 2K bank of the status bar's font,
# a 2K bank of the playfield's tiles, four 2K banks of the water's frames, and a 1K bank of the
# sprite, each a memory area of its own. Their `bank` is their number in the MMC3's 1K units.
#
# The program reads each bank's number with `.bankof`, which ld65 answers from the `bank` here.
MEMORY {
    ZP:     file = "", start = $0000, size = $0100;
    OAM:    file = "", start = $0200, size = $0100;
    RAM:    file = "", start = $0300, size = $0500;
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;
    PRG0:   file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF, bank = 0;
    PRG1:   file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF, bank = 1;
    PRG2:   file = %O, start = $8000, size = $2000, fill = yes, fillval = $FF, bank = 2;
    PRG3:   file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF, bank = 3;
    PRG4:   file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF, bank = 4;
    PRG5:   file = %O, start = $A000, size = $2000, fill = yes, fillval = $FF, bank = 5;
    PRG6:   file = %O, start = $C000, size = $2000, fill = yes, fillval = $FF, bank = 6;
    PRG7:   file = %O, start = $E000, size = $2000, fill = yes, fillval = $FF, bank = 7;
    FONT:   file = %O, start = $0000, size = $0800, fill = yes, bank = 0;
    LAND:   file = %O, start = $0000, size = $0800, fill = yes, bank = 2;
    WATER0: file = %O, start = $0800, size = $0800, fill = yes, bank = 4;
    WATER1: file = %O, start = $0800, size = $0800, fill = yes, bank = 6;
    WATER2: file = %O, start = $0800, size = $0800, fill = yes, bank = 8;
    WATER3: file = %O, start = $0800, size = $0800, fill = yes, bank = 10;
    SPRITE: file = %O, start = $1000, size = $0400, fill = yes, bank = 12;
    UNUSED: file = %O, start = $1400, size = $0C00, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    OAM:      load = OAM,    type = bss, align = $100;
    BSS:      load = RAM,    type = bss;
    HEADER:   load = HEADER, type = ro;
    BANK0:    load = PRG0,   type = ro;
    BANK1:    load = PRG1,   type = ro;
    BANK2:    load = PRG2,   type = ro;
    BANK3:    load = PRG3,   type = ro;
    BANK4:    load = PRG4,   type = ro;
    BANK5:    load = PRG5,   type = ro;
    DMC:      load = PRG6,   type = ro, align = 64;
    CODE:     load = PRG6,   type = ro;
    RODATA:   load = PRG6,   type = ro;
    STARTUP:  load = PRG7,   type = ro;
    VECTORS:  load = PRG7,   type = ro, start = $FFFA;
    CHRFONT:  load = FONT,   type = ro;
    CHRLAND:  load = LAND,   type = ro;
    CHRWATER0: load = WATER0, type = ro;
    CHRWATER1: load = WATER1, type = ro;
    CHRWATER2: load = WATER2, type = ro;
    CHRWATER3: load = WATER3, type = ro;
    CHRSPRITE: load = SPRITE, type = ro;
}
