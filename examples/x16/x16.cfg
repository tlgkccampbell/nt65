# A PRG that loads where BASIC programs do, and two files beside it, one for each RAM bank the
# card uses, which the program loads into its bank at $A000. ld65 names each after the PRG,
# with the bank's number after it. Each starts with the address it loads at, as a PRG does,
# and `bank` gives each area the number `.bankof` reads. The zero page from $22 to $7F is the
# one the KERNAL and BASIC leave to programs.
MEMORY {
    ZP:        file = "",      start = $0022, size = $005E;
    LOADADDR:  file = %O,      start = $07FF, size = $0002;
    MAIN:      file = %O,      start = $0801, size = $96FF;
    DRAWHEAD:  file = "%O.01", start = $9FFE, size = $0002;
    DRAWBANK:  file = "%O.01", start = $A000, size = $2000, bank = 1;
    CARDHEAD:  file = "%O.02", start = $9FFE, size = $0002;
    CARDBANK:  file = "%O.02", start = $A000, size = $2000, bank = 2;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    STARTUP:  load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    BSS:      load = MAIN,     type = bss;
    DRAWHEAD: load = DRAWHEAD, type = ro;
    DRAW:     load = DRAWBANK, type = ro;
    CARDHEAD: load = CARDHEAD, type = ro;
    CARD:     load = CARDBANK, type = ro;
}
