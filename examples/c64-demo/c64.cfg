# A PRG that loads where BASIC programs do. The demo never goes back to BASIC, so the zero page
# BASIC keeps from $02 to $8F is the demo's: its variables, and the decruncher, which is loaded
# with the rest of the program and copied to where it runs. The raster code that counts cycles
# is in a segment of its own, on a page boundary.
MEMORY {
    ZP:       file = "", start = $0002, size = $0010;
    ZPCODE:   file = "", start = $0012, size = $007E;
    LOADADDR: file = %O, start = $07FF, size = $0002;
    MAIN:     file = %O, start = $0801, size = $97FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    STARTUP:  load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    TIMED:    load = MAIN,     type = ro, align = $100;
    UNPACK:   load = MAIN,     run = ZPCODE, type = rw, define = yes;
    BSS:      load = MAIN,     type = bss;
}
