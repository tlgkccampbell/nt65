# KIM-1 BASIC (KB-9). Zero page is four blocks, which may overlap where the original BASIC
# shared locations; everything else goes in the ROM in this order. CHRGET runs in zero
# page, after the variables in ZP4, and init copies it there from the ROM.
MEMORY {
	ZP1:		start = $00, size = $100, type = rw, file = "";
	ZP2:		start = $15, size = $EB, type = rw, file = "";
	ZP3:		start = $0A, size = $F6, type = rw, file = "";
	ZP4:		start = $63, size = $9D, type = rw, file = "";
	BASROM:		start = $2000, size = $3F00, fill = no, file = %O;
}

SEGMENTS {
	ZP1:		load = ZP1, type = zp;
	ZP2:		load = ZP2, type = zp;
	ZP3:		load = ZP3, type = zp;
	ZP4:		load = ZP4, type = zp;
	HEADER:		load = BASROM,	type = ro, optional = yes;
	VECTORS:	load = BASROM,	type = ro;
	KEYWORDS:	load = BASROM,	type = ro;
	ERROR:		load = BASROM,	type = ro;
	CODE:		load = BASROM,	type = ro;
	CHRGET:		load = BASROM,	run = ZP4, type = rw, define = yes;
	INIT:		load = BASROM,	type = ro;
	EXTRA:		load = BASROM,	type = ro, optional = yes;
}
