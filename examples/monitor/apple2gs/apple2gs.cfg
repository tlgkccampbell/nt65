# A binary file that loads at $2000, below where BASIC.SYSTEM starts at $9600, with its
# variables after it. $FA to $FF are the zero page the firmware, Applesoft and ProDOS leave free.
# BUFFER is the 1024 bytes ProDOS keeps an open file's blocks in, which must start a page.
MEMORY {
    ZP:   file = "", start = $00FA, size = $0006;
    MAIN: file = %O, start = $2000, size = $7600;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = MAIN, type = ro;
    CODE:     load = MAIN, type = ro;
    RAMCODE:  load = MAIN, type = rw;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss;
    BUFFER:   load = MAIN, type = bss, align = $100;
}
