# An NROM cartridge, as an iNES file: a 16-byte header, 16K of program ROM, which the NES sees at
# $8000 and again at $C000, and 8K of character ROM, which the PPU sees at $0000. The zero page
# is page 0, the stack page 1, and the variables start at $0200, in the NES's 2K of RAM.
MEMORY {
    ZP:     file = "", start = $0000, size = $0100;
    RAM:    file = "", start = $0200, size = $0600;
    HEADER: file = %O, start = $0000, size = $0010, fill = yes;
    ROM:    file = %O, start = $C000, size = $4000, fill = yes, fillval = $FF;
    CHR:    file = %O, start = $0000, size = $2000, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    BSS:      load = RAM,    type = bss, align = $20;
    HEADER:   load = HEADER, type = ro;
    CODE:     load = ROM,    type = ro;
    RODATA:   load = ROM,    type = ro;
    VECTORS:  load = ROM,    type = ro, start = $FFFA;
    CHARS:    load = CHR,    type = ro;
}
