# A LoROM cartridge of 32K, which the Super NES sees at $8000 to $FFFF in bank 0, with the
# header and vectors at its end. The direct page is page 0, the stack page 1, and the rest of the
# first 8K of RAM holds the variables.
MEMORY {
    ZP:  file = "", start = $0000, size = $0100;
    RAM: file = "", start = $0200, size = $1E00;
    ROM: file = %O, start = $8000, size = $8000, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro;
    HEADER:   load = ROM, type = ro, start = $FFC0;
}
