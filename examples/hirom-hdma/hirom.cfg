# A HiROM cartridge of 128K: two banks of 64K, which the Super NES sees whole at $C0 and $C1,
# where they are FastROM once MEMSEL says so. The second half of the first bank is also seen at
# $8000 to $FFFF of bank $00, which is where the vectors point, so the stubs that the vectors
# name run there and jump on into bank $C0. The direct page is page 0, the stack is at the top
# of the first 8K of RAM, and the HDMA tables the program builds are in bank $7E.
MEMORY {
    ZP:     start = $000000, size = $0100;
    LORAM:  start = $000100, size = $1D00;
    WRAM:   start = $7E2000, size = $E000;
    DATA0:  start = $C00000, size = $8000, file = %O, fill = yes, fillval = $FF;
    CODE0:  start = $C08000, size = $7F00, file = %O, fill = yes, fillval = $FF;
    ENTRY:  start = $00FF00, size = $0100, file = %O, fill = yes, fillval = $FF;
    BANK1:  start = $C10000, size = $10000, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    BSS:      load = LORAM, type = bss;
    WRAM:     load = WRAM,  type = bss;
    RODATA:   load = DATA0, type = ro;
    CODE:     load = CODE0, type = ro;
    ENTRY:    load = ENTRY, type = ro;
    HEADER:   load = ENTRY, type = ro, start = $00FFC0;
    VECTORS:  load = ENTRY, type = ro, start = $00FFE0;
    CODE1:    load = BANK1, type = ro;
    RODATA1:  load = BANK1, type = ro;
}
